<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画自動編集ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", sans-serif;
      background: #f0f2f5;
      color: #2d3436;
      min-height: 100vh;
      padding: 32px 16px 60px;
    }

    .container { max-width: 680px; margin: 0 auto; }

    h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #636e72; font-size: 0.85rem; margin-bottom: 28px; }

    /* ---- カード ---- */
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b2bec3;
    }
    .btn-clear-top {
      font-size: 0.75rem;
      color: #636e72;
      background: none;
      border: 1px solid #dfe6e9;
      border-radius: 5px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .btn-clear-top:hover { background: #f5f6fa; color: #d63031; border-color: #ff7675; }

    /* ---- ドロップゾーン ---- */
    .drop-zone {
      border: 2px dashed #b2bec3;
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #0984e3; background: #f0f8ff; }
    .drop-zone .icon { font-size: 2.2rem; margin-bottom: 8px; }
    .drop-zone .hint { color: #636e72; font-size: 0.85rem; line-height: 1.6; }

    .spinner {
      display: none;
      width: 24px; height: 24px;
      border: 3px solid #dfe6e9;
      border-top-color: #0984e3;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 12px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .file-list { margin-top: 14px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #f5f6fa;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .file-item .num {
      background: #0984e3;
      color: #fff;
      border-radius: 50%;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      flex-shrink: 0;
    }

    /* ---- フォーム ---- */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #636e72;
      margin-bottom: 5px;
    }
    .label-hint { font-weight: 400; color: #b2bec3; }

    input[type="number"], input[type="text"] {
      width: 100%;
      border: 1.5px solid #dfe6e9;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #0984e3; }

    .ref-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .btn-preview {
      padding: 9px 16px;
      border: 1.5px solid #0984e3;
      border-radius: 7px;
      background: transparent;
      color: #0984e3;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-preview:hover { background: #f0f8ff; }
    .btn-preview:disabled { opacity: .4; cursor: not-allowed; }

    /* ---- ROI Canvas ---- */
    .preview-wrap {
      margin-top: 12px;
      display: none;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #dfe6e9;
      background: #000;
      position: relative;
    }
    #roi-canvas {
      display: block;
      width: 100%;
      cursor: crosshair;
      user-select: none;
    }
    .preview-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #f5f6fa;
    }
    .preview-label { font-size: 0.72rem; color: #636e72; }
    .roi-info { font-size: 0.72rem; color: #0984e3; font-weight: 600; }
    .btn-roi-clear {
      font-size: 0.72rem;
      color: #636e72;
      background: none;
      border: 1px solid #dfe6e9;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .btn-roi-clear:hover { color: #d63031; border-color: #ff7675; }
    .roi-hint {
      font-size: 0.72rem;
      color: #b2bec3;
      margin-top: 5px;
    }

    /* 2カラムグリッド */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ---- ボタン ---- */
    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0984e3;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 4px;
    }
    .btn-primary:disabled { background: #b2bec3; cursor: not-allowed; }
    .btn-download {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #00b894;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
    .btn-retry {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #636e72;
      border-radius: 8px;
      background: transparent;
      color: #636e72;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* ---- プログレス ---- */
    #progress-card { display: none; }
    .progress-bar-wrap {
      background: #dfe6e9;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0984e3, #74b9ff);
      border-radius: 999px;
      transition: width .5s;
      width: 0%;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #636e72;
    }
    .progress-meta .pct { color: #0984e3; font-weight: 700; }

    /* ---- 結果 ---- */
    #result-card { display: none; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
    .stat-item { background: #f5f6fa; border-radius: 8px; padding: 14px; text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 700; color: #0984e3; }
    .stat-lbl { font-size: 0.72rem; color: #636e72; margin-top: 2px; }

    .error-box {
      background: #fff5f5;
      border: 1.5px solid #ff7675;
      border-radius: 8px;
      padding: 12px 14px;
      color: #d63031;
      font-size: 0.85rem;
      display: none;
      margin-bottom: 8px;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
<div class="container">

  <h1>動画自動編集ツール</h1>
  <p class="subtitle">工場工程のサイクル動作を自動検出・切り出し・結合します</p>

  <!-- ① 動画アップロード -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">① 動画ファイル（複数可）</div>
      <button class="btn-clear-top" id="clear-btn">クリア</button>
    </div>
    <div class="drop-zone" id="drop-zone">
      <div class="icon">🎬</div>
      <div class="hint">
        クリックまたはドラッグ＆ドロップで動画を選択<br>
        複数ファイルはファイル名の昇順で処理されます
      </div>
      <div class="spinner" id="upload-spinner"></div>
    </div>
    <input type="file" id="file-input" accept="video/*" multiple style="display:none">
    <div class="file-list" id="file-list"></div>
  </div>

  <!-- ② 基準フレーム -->
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">② 基準フレーム（サイクル開始の瞬間）</div>
    <div class="field">
      <label>基準時刻 <span class="label-hint">— 動画内でサイクルが始まる時刻</span></label>
      <div class="ref-row">
        <input type="number" id="ref-time" value="0" min="0" step="0.1" placeholder="例: 5.2">
        <button class="btn-preview" id="preview-btn" disabled>プレビュー</button>
      </div>
      <div style="margin-top:5px; font-size:0.75rem; color:#b2bec3;">
        ※ 動画プレイヤーで確認した時刻（秒）を入力してください
      </div>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <canvas id="roi-canvas"></canvas>
      <div class="preview-footer">
        <span class="preview-label" id="preview-label"></span>
        <span class="roi-info" id="roi-info"></span>
        <button class="btn-roi-clear" id="roi-clear-btn" style="display:none">ROIをクリア</button>
      </div>
    </div>
    <div class="roi-hint" id="roi-hint" style="display:none">
      画像をドラッグして検出エリアを絞り込めます（未選択=全体）
    </div>
  </div>

  <!-- ③ パラメータ -->
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">③ 切り出し設定</div>

    <div class="grid2">
      <div class="field">
        <label>検出前 <span class="label-hint">（秒）</span></label>
        <input type="number" id="before-sec" value="0" min="0" step="0.1">
      </div>
      <div class="field">
        <label>検出後 <span class="label-hint">（秒）</span></label>
        <input type="number" id="after-sec" value="5" min="0.1" step="0.1">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label>類似度閾値 <span class="label-hint">（0〜1）</span></label>
        <input type="number" id="threshold" value="0.92" min="0" max="1" step="0.01">
      </div>
      <div class="field">
        <label>最小サイクル間隔 <span class="label-hint">（秒）</span></label>
        <input type="number" id="min-cycle" value="5" min="0.5" step="0.5">
      </div>
    </div>

    <div class="field">
      <label>ナンバリングテキスト <span class="label-hint">— {n}=番号 / {t}=タイムスタンプ</span></label>
      <input type="text" id="overlay-text" value="Cycle {n}">
    </div>

    <button class="btn-primary" id="run-btn" disabled>処理を開始する</button>
  </div>

  <!-- ④ 進捗 -->
  <div class="card" id="progress-card">
    <div class="card-title" style="margin-bottom:0">④ 処理中</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-meta">
      <span id="stage-label">待機中...</span>
      <span class="pct" id="pct-label">0%</span>
    </div>
  </div>

  <!-- ⑤ 結果 -->
  <div class="card" id="result-card">
    <div class="card-title" style="margin-bottom:16px">⑤ 完了</div>
    <div class="error-box" id="error-box"></div>
    <div class="stat-grid">
      <div class="stat-item">
        <div class="stat-num" id="res-cycles">—</div>
        <div class="stat-lbl">検出サイクル数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="res-clips">—</div>
        <div class="stat-lbl">出力クリップ数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="res-time">—</div>
        <div class="stat-lbl">処理時間（秒）</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="res-skip">—</div>
        <div class="stat-lbl">スキップ数</div>
      </div>
    </div>
    <button class="btn-download" id="download-btn">output.mp4 をダウンロード</button>
    <button class="btn-retry" id="retry-btn">別の動画を処理する</button>
  </div>

</div>

<script>
  let uploadId   = null;
  let jobId      = null;
  let pollTimer  = null;
  let previewDebounce = null;

  // ROI state (fraction 0-1 of original image)
  let roi = null;  // {x, y, w, h} as fractions
  let _imgNaturalW = 1, _imgNaturalH = 1;
  let _currentFrameUrl = null;

  // ---- ファイル選択 ----
  const dropZone  = document.getElementById("drop-zone");
  const fileInput = document.getElementById("file-input");

  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => handleFiles(Array.from(e.target.files)));
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("over");
    handleFiles(Array.from(e.dataTransfer.files));
  });

  async function handleFiles(files) {
    if (!files.length) return;

    document.getElementById("upload-spinner").style.display = "block";
    document.getElementById("file-list").innerHTML = "";
    document.getElementById("preview-btn").disabled = true;
    document.getElementById("run-btn").disabled = true;

    const fd = new FormData();
    let totalBytes = 0;
    files.forEach(f => { fd.append("videos", f); totalBytes += f.size; });

    // ファイルサイズ表示
    const mb = (totalBytes / 1024 / 1024).toFixed(1);
    document.querySelector("#drop-zone .hint").textContent = `アップロード中... (${mb} MB)`;

    try {
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => controller.abort(), 300_000); // 5分
      const res  = await fetch("/api/upload", { method: "POST", body: fd, signal: controller.signal });
      clearTimeout(timeoutId);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "アップロード失敗");

      uploadId = data.upload_id;
      renderFileList(data.files);
      document.querySelector("#drop-zone .hint").textContent =
        "クリックまたはドラッグ＆ドロップで動画を選択\n複数ファイルはファイル名の昇順で処理されます";
      document.getElementById("preview-btn").disabled = false;
      document.getElementById("run-btn").disabled = false;
    } catch (e) {
      const msg = e.name === "AbortError"
        ? "アップロードがタイムアウトしました（5分超）。ファイルが大きすぎる可能性があります。"
        : "アップロードエラー: " + e.message + "\nサーバーが起動しているか確認してください。";
      alert(msg);
      document.querySelector("#drop-zone .hint").textContent =
        "クリックまたはドラッグ＆ドロップで動画を選択\n複数ファイルはファイル名の昇順で処理されます";
    } finally {
      document.getElementById("upload-spinner").style.display = "none";
    }
  }

  function renderFileList(files) {
    const list = document.getElementById("file-list");
    list.innerHTML = files.map((f, i) =>
      `<div class="file-item">
        <div class="num">${i + 1}</div>
        <span>${f}</span>
      </div>`
    ).join("");
  }

  // ---- 基準フレームプレビュー ----
  const previewBtn  = document.getElementById("preview-btn");
  const previewWrap = document.getElementById("preview-wrap");
  const previewLbl  = document.getElementById("preview-label");
  const refTimeEl   = document.getElementById("ref-time");

  previewBtn.addEventListener("click", () => fetchPreview());
  refTimeEl.addEventListener("input", () => {
    clearTimeout(previewDebounce);
    if (!uploadId) return;
    previewDebounce = setTimeout(fetchPreview, 500);
  });

  async function fetchPreview() {
    if (!uploadId) return;
    const t = parseFloat(refTimeEl.value) || 0;
    try {
      const res = await fetch(`/api/frame/${uploadId}?time_sec=${t}`);
      if (!res.ok) return;
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      _currentFrameUrl = url;
      drawCanvas(url, () => {
        previewWrap.style.display = "block";
        document.getElementById("roi-hint").style.display = "block";
        previewLbl.textContent = `基準フレーム（${t.toFixed(1)} 秒）`;
      });
    } catch (e) { /* 無視 */ }
  }

  // ---- Canvas + ROI ----
  const canvas = document.getElementById("roi-canvas");
  const ctx    = canvas.getContext("2d");
  let _img     = null;
  let dragging = false;
  let dragStart = null;
  let dragCurrent = null;

  function drawCanvas(url, onLoad) {
    const img = new Image();
    img.onload = () => {
      _img = img;
      _imgNaturalW = img.naturalWidth;
      _imgNaturalH = img.naturalHeight;
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      redraw();
      if (onLoad) onLoad();
    };
    img.src = url;
  }

  function redraw() {
    if (!_img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(_img, 0, 0);

    const r = _getRoiPixels();
    if (r) {
      ctx.fillStyle   = "rgba(9,132,227,0.12)";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = "#0984e3";
      ctx.lineWidth   = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.setLineDash([]);
    }
  }

  function _getRoiPixels() {
    if (dragging && dragStart && dragCurrent) {
      return _normalizeRect(dragStart, dragCurrent);
    }
    if (roi) {
      return {
        x: roi.x * _imgNaturalW,
        y: roi.y * _imgNaturalH,
        w: roi.w * _imgNaturalW,
        h: roi.h * _imgNaturalH,
      };
    }
    return null;
  }

  function _normalizeRect(a, b) {
    return {
      x: Math.min(a.x, b.x),
      y: Math.min(a.y, b.y),
      w: Math.abs(a.x - b.x),
      h: Math.abs(a.y - b.y),
    };
  }

  function _canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top)  * scaleY,
    };
  }

  canvas.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    dragging   = true;
    dragStart  = _canvasCoords(e);
    dragCurrent = dragStart;
    roi = null;
    updateRoiUI();
  });

  canvas.addEventListener("mousemove", e => {
    if (!dragging) return;
    dragCurrent = _canvasCoords(e);
    redraw();
  });

  canvas.addEventListener("mouseup", e => {
    if (!dragging) return;
    dragging = false;
    const r = _normalizeRect(dragStart, _canvasCoords(e));
    if (r.w > 5 && r.h > 5) {
      roi = {
        x: r.x / _imgNaturalW,
        y: r.y / _imgNaturalH,
        w: r.w / _imgNaturalW,
        h: r.h / _imgNaturalH,
      };
    } else {
      roi = null;
    }
    dragStart = dragCurrent = null;
    redraw();
    updateRoiUI();
  });

  canvas.addEventListener("mouseleave", e => {
    if (dragging) {
      dragging = false;
      dragStart = dragCurrent = null;
      redraw();
    }
  });

  // タッチ対応
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    dragging   = true;
    dragStart  = _canvasCoords(e.touches[0]);
    dragCurrent = dragStart;
    roi = null;
    updateRoiUI();
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!dragging) return;
    dragCurrent = _canvasCoords(e.touches[0]);
    redraw();
  }, { passive: false });

  canvas.addEventListener("touchend", e => {
    if (!dragging) return;
    dragging = false;
    const r = _normalizeRect(dragStart, dragCurrent || dragStart);
    if (r.w > 5 && r.h > 5) {
      roi = {
        x: r.x / _imgNaturalW,
        y: r.y / _imgNaturalH,
        w: r.w / _imgNaturalW,
        h: r.h / _imgNaturalH,
      };
    } else {
      roi = null;
    }
    dragStart = dragCurrent = null;
    redraw();
    updateRoiUI();
  });

  function updateRoiUI() {
    const info    = document.getElementById("roi-info");
    const clearBtn = document.getElementById("roi-clear-btn");
    if (roi) {
      const xp = Math.round(roi.x * 100);
      const yp = Math.round(roi.y * 100);
      const wp = Math.round(roi.w * 100);
      const hp = Math.round(roi.h * 100);
      info.textContent = `ROI: ${xp}%, ${yp}% / ${wp}%×${hp}%`;
      clearBtn.style.display = "inline-block";
    } else {
      info.textContent = "";
      clearBtn.style.display = "none";
    }
  }

  document.getElementById("roi-clear-btn").addEventListener("click", () => {
    roi = null;
    redraw();
    updateRoiUI();
  });

  // ---- 処理開始 ----
  document.getElementById("run-btn").addEventListener("click", async () => {
    if (!uploadId) return;

    const fd = new FormData();
    fd.append("ref_time_sec",  document.getElementById("ref-time").value);
    fd.append("before_sec",    document.getElementById("before-sec").value);
    fd.append("after_sec",     document.getElementById("after-sec").value);
    fd.append("threshold",     document.getElementById("threshold").value);
    fd.append("min_cycle_sec", document.getElementById("min-cycle").value);
    fd.append("overlay_text",  document.getElementById("overlay-text").value);

    if (roi) {
      fd.append("roi_x", roi.x.toFixed(4));
      fd.append("roi_y", roi.y.toFixed(4));
      fd.append("roi_w", roi.w.toFixed(4));
      fd.append("roi_h", roi.h.toFixed(4));
    }

    document.getElementById("run-btn").disabled = true;
    show("progress-card");
    hide("result-card");

    try {
      const res  = await fetch(`/api/process/${uploadId}`, { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "処理開始失敗");
      jobId = data.job_id;
      pollTimer = setInterval(pollStatus, 1500);
    } catch (e) {
      showError(e.message);
    }
  });

  // ---- ポーリング ----
  async function pollStatus() {
    try {
      const res  = await fetch(`/api/status/${jobId}`);
      const data = await res.json();

      document.getElementById("progress-fill").style.width  = data.progress + "%";
      document.getElementById("stage-label").textContent    = data.stage;
      document.getElementById("pct-label").textContent      = data.progress + "%";

      if (data.status === "done") {
        clearInterval(pollTimer);
        showResult(data.result);
      } else if (data.status === "error") {
        clearInterval(pollTimer);
        showError(data.error);
      }
    } catch (e) { /* 一時ネットワークエラーは無視 */ }
  }

  // ---- 結果表示 ----
  function showResult(r) {
    hide("progress-card");
    show("result-card");
    document.getElementById("res-cycles").textContent = r.detected_cycles;
    document.getElementById("res-clips").textContent  = r.extracted_segments;
    document.getElementById("res-time").textContent   = r.processing_time_sec;
    document.getElementById("res-skip").textContent   = r.skipped_cycles.length;

    const btn = document.getElementById("download-btn");
    btn.style.display = "block";
    btn.onclick = () => { window.location.href = `/api/download/${jobId}`; };
  }

  function showError(msg) {
    hide("progress-card");
    show("result-card");
    const box = document.getElementById("error-box");
    box.style.display = "block";
    box.textContent   = "エラー: " + msg;
    document.getElementById("run-btn").disabled = false;
  }

  // ---- クリア ----
  function resetAll() {
    clearInterval(pollTimer);
    uploadId = jobId = null;
    roi = null;
    _img = null;
    _currentFrameUrl = null;
    fileInput.value = "";
    document.getElementById("file-list").innerHTML    = "";
    document.getElementById("preview-wrap").style.display = "none";
    document.getElementById("roi-hint").style.display = "none";
    document.getElementById("error-box").style.display    = "none";
    document.getElementById("download-btn").style.display = "none";
    document.getElementById("progress-fill").style.width  = "0%";
    document.getElementById("preview-btn").disabled = true;
    document.getElementById("run-btn").disabled     = true;
    updateRoiUI();
    hide("progress-card");
    hide("result-card");
  }

  document.getElementById("clear-btn").addEventListener("click", resetAll);
  document.getElementById("retry-btn").addEventListener("click", resetAll);

  function show(id) { document.getElementById(id).style.display = "block"; }
  function hide(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
