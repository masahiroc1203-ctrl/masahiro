<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポーズ確認</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { padding: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .row h3 { width: 150px; font-size: 12px; margin: 0; flex: none; }
  .row .fig { width: 120px; height: 100px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; flex: none; }
</style>
</head>
<body>
<p>開発用：各種目のキーフレーム間を等間隔でスナップショット表示します（左端はライブ再生）。</p>
<div id="list"></div>
<script type="module">
  import { EXERCISES } from '../js/data/exercises.js';
  import { createFigure } from '../js/figure.js';
  const params = new URLSearchParams(location.search);
  const only = params.get('ids')?.split(',');
  const n = Number(params.get('n') || 6);
  const list = document.getElementById('list');
  for (const ex of EXERCISES) {
    if (only && !only.includes(ex.id)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<h3>${ex.name}<br><small>${ex.id}</small></h3>`;
    if (!params.has('static')) row.append(createFigure(ex).el);
    for (let i = 0; i < n; i++) row.append(createFigure(ex, { animate: false, at: (ex.anim.ms * i) / n }).el);
    list.append(row);
  }
</script>
</body>
</html>
