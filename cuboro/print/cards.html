<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キュボロ 課題カード（印刷用）</title>
<style>
  :root {
    --ink: #1c1917;
    --sub: #57534e;
    --line: #d6d3d1;
    --bg: #fafaf9;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f5f5f4; --sub:#a8a29e; --line:#44403c; --bg:#1c1917; --card:#292524; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 780px; margin: 0 auto 28px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--sub); font-size: .9rem; }
  .sheet { max-width: 780px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 13px 13px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .card-head { display: flex; align-items: baseline; gap: 8px; }
  .badge {
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 2px 7px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }
  .lv0 { background:#78716c } .lv1 { background:#0d9488 } .lv2 { background:#2563eb }
  .lv3 { background:#7c3aed } .lv4 { background:#db2777 } .lv5 { background:#ea580c }
  .no { font-size: .68rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .star { font-size: .68rem; color: #ea580c; margin-left: auto; }
  .title { font-size: 1.02rem; font-weight: 700; line-height: 1.35; margin: 0; }
  .task { font-size: .84rem; margin: 0; }
  .clear { font-size: .75rem; color: var(--sub); margin: 0; }
  .clear::before { content: "クリア　"; font-weight: 700; color: var(--ink); }
  .note {
    font-size: .7rem;
    color: var(--sub);
    margin: auto 0 0;
    padding-top: 7px;
    border-top: 1px dashed var(--line);
  }
  .note::before { content: "おうちのひとへ　"; font-weight: 700; }
  .sec { grid-column: 1 / -1; margin: 18px 0 2px; font-size: .82rem; font-weight: 700; color: var(--sub); letter-spacing: .04em; }
  .sec:first-child { margin-top: 0; }

  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; color: #000; padding: 0; font-size: 10pt; }
    header, .noprint { display: none; }
    .sheet { max-width: none; }
    .grid { grid-template-columns: 1fr 1fr; gap: 0; }
    .card {
      border: 1px dashed #999;
      border-radius: 0;
      height: 89mm;
      padding: 6mm 6mm 5mm;
      background: #fff;
      overflow: hidden;
    }
    .sec { display: none; }
    .badge { color: #000; background: none !important; border: 1px solid #000; }
    .note { color: #333; }
  }
</style>
</head>
<body>
<header>
  <h1>キュボロ 課題カード</h1>
  <p>32枚。Ctrl / ⌘ + P でA4に6枚ずつ印刷して、破線で切り取って使います。制約は1回に1つだけ。</p>
</header>

<div class="sheet"><div class="grid" id="grid"></div></div>

<script>
const CARDS = [
["0","0-1","おなじにつくろう","おうちのひとが作った3個のコースと、同じものを作ってみよう","同じ形になればOK。転がらなくてもいい","溝の向きだけ合っていれば大成功。真似は模倣ではなく観察の練習。「よく見てるね」"],
["0","0-2","どっちがビー玉のみち？","この積み木、ビー玉はどこを通ると思う？指でなぞってみて","指でなぞれたらOK","転がす前に予想させるのがポイント。外れても訂正せず、実際に転がして一緒に確かめる"],
["0","0-3","ビー玉をおいかけろ","おうちのひとが長いコースを作るよ。ビー玉がどこに出てくるか、当ててね","出口を指させたらOK","親が本気で作って見せる回。子どもの「作りたい」はここから生まれる"],

["1","1-1","まっすぐ3こ","積み木3個をまっすぐ並べて、ビー玉をゴールまで転がそう","途中で止まらずに転がりきる","最初の成功体験。積み木がずれて隙間ができているだけのことが多い。「くっつけてみようか」だけ"],
["1","1-2","いっかいまがる","ビー玉を1回だけ曲げてゴールさせよう","直角に1回曲がって転がりきる","カーブの溝がある積み木を探すところから。「曲がる道が描いてあるの、どれかな」"],
["1","1-3","ぜんぶとおる","積み木5個ぜんぶをビー玉が通るコースを作ろう","5個すべてを通過する","「数を指定する」タイプの最初。余った積み木は横に置いておくと分かりやすい"],
["1","1-4","かべにそって","積み木を四角く囲むように置いて、その上をビー玉に走らせよう","一周しなくていい。角を2回曲がれば合格","角のカーブが2回続くのは意外に難しい。1個ずつ置いて転がして確かめる方法を見せる"],
["1","1-5","とおまわり","積み木4個で、いちばん遠回りするコースを作ろう","4個で作れる最長ルートに挑戦","正解を出す課題ではない。「もっと遠回りできない？」と2回だけ聞く"],
["1","1-6","スタートはここ、ゴールはここ","スタートはここ、ゴールはここ。つないでみよう","指定の2点がつながる","最初は近くに。慣れたら対角線上に離す。付箋やおはじきを置いて示す"],

["2","2-1","トンネルを1つ","穴の空いた積み木をコースに1個入れて、ビー玉を中に通そう","トンネルを1回通過する","積み木の中がどうなっているか、先に手に持って穴を覗かせる。上下・左右に回して観察させる"],
["2","2-2","2びょうかくれる","ビー玉が見えなくなる時間を2秒つくろう","「いち、に」の間、姿が見えない","トンネルを直列につなぐ発想が要る。声に出して一緒に数えると盛り上がる"],
["2","2-3","1だんおちる","上の段から下の段へ、ビー玉を落とすコースを作ろう","高さが変わって転がり続ける","落とし穴の下に受ける溝が要る。「落ちた先、どこ行くんだろうね」と一緒に覗く"],
["2","2-4","のぼってからおりる","土台の積み木を使って高いところからスタートし、下まで降ろそう","2段以上の高低差を作る","穴なしの立方体は「土台」に使えると教える。気づくと表現の幅が一気に広がる"],
["2","2-5","ぜんぶ地下","スタートからゴールまで、一度も見えないコースを作ろう","途中で姿が見えない","難易度は高め。できなければ「半分だけ地下」に落とす"],
["2","2-6","みえないところでまがる","ビー玉が見えないあいだに、曲がるようにしよう","入った向きと違う向きから出てくる","中の道を想像する練習。作る前に「入口はここ、出口はどこになると思う？」"],

["3","3-1","ちょうど12こ","積み木をちょうど12個使ってコースを作ろう。多くても少なくてもダメ","12個ちょうどで転がりきる","数を先に数えて脇に並べさせる。足りない／余ったときの作り直しが学びの本体"],
["3","3-2","いちばん長くころがる","ビー玉がいちばん長い時間ころがるコースを作ろう。時間を測るよ","前回の記録を超える","「速さ」ではなく「長さ」を競うのが肝。記録を紙に書いて残すと何度でも挑戦する"],
["3","3-3","えをかいてからつくる","どんなコースにするか、先に紙に描こう。それから作る","描いたものと同じコースができる","絵は下手でいい。上から見た図でも横から見た図でもいい。設計と実装の分離を体で覚える"],
["3","3-4","3だんのとう","高さ3段の塔を作って、てっぺんから下までビー玉を降ろそう","3段の高低差を通過してゴール","崩れやすいので土台を広く取る発想が要る。崩れたら「どうすれば倒れないかな」"],
["3","3-5","スタートとゴールがおなじがわ","スタートとゴールを同じ側に作ろう。ビー玉は行って帰ってくる","出発点の近くに戻ってくる","U字には段差が要る。高さが足りないと必ず失敗する。ヒントは「もう1段上げてみたら？」"],
["3","3-6","ぜんぶつかう","持っている積み木を全部使ってコースを作ろう","1個も余らず、転がりきる","大作になるので時間を長めに。途中で終わってもいい。写真を撮って残す"],
["3","3-7","じめんにつかない","ビー玉が机に一度も触らないコースを作ろう","最後まで積み木の中と上だけを通る","隙間ができると落ちる。接続の精度を意識させる課題"],

["4","4-1","こわれたコース","おうちのひとが作ったコースの積み木を1個こっそり回したよ。どこか見つけて直して","元のように転がるようになる","デバッグそのもの。最初は見える位置の1個から。慣れたらトンネル内を回す。「どこまでは転がった？」だけ",true],
["4","4-2","どっちにいく？","道が2つに分かれるコースを作ろう。流す前に、どっちに行くか予想してね","分岐を作り、予想してから流す","当たり外れは問わない。「なんでそう思ったの？」で理由を言わせる"],
["4","4-3","ふたつ同時ゴール","ビー玉2個を同時にスタートさせて、同時にゴールさせよう","ほぼ同時に到着する","難問。2本の道の長さを揃える必要がある。「どっちが先に着いた？じゃあそっちを長くする？」"],
["4","4-4","ぎゃくむきにもながれる","ゴール側からビー玉を入れても転がるコースを作ろう","両方向から流れる","段差があると逆流できないことに自分で気づかせる。気づいた瞬間が価値"],
["4","4-5","1こだけ動かして直す","このコース、途中で止まっちゃう。積み木1個だけ動かして直せる？","1個の移動または回転で解決する","親が「1個で直せる壊れ方」を仕込んでおく。作り直すのではなく原因を特定する練習"],
["4","4-6","こうごづみ対戦","1個ずつ交代で積んでいこう。ビー玉が止まるコースにしちゃった人が負け","相手が止まるコースを作る","親も本気で。負けてあげなくていい。市販の tricky ways はこの形式のゲーム"],
["4","4-7","きみが出題する","今日はきみがおうちのひとに課題を出して","出題して、親が挑戦する","これができたら理解が定着している合図。無茶な課題でも真面目に挑戦し、解けなければ負けを認める",true],

["5","5-1","10びょうチャレンジ","ビー玉が10秒以上ころがり続けるコースを作ろう","10.0秒以上","何日がかりでもいい。記録更新のたびに日付と秒数を書き残す"],
["5","5-2","ビー玉が2かい消える","見えなくなる区間を2か所つくって、しかも最後まで転がりきらせよう","独立した2つの地下区間を通過","全体構成を先に決めないと作れない。3-3（先に絵を描く）を経てから挑む"],
["5","5-3","ことばだけで伝える","作ったコースを見せずに、言葉だけで説明して、同じものを作ってもらおう","相手がほぼ同じコースを再現できる","最高難度。「右」「上から2段目」など座標を言う必要が出る。プログラムを書く経験そのもの"],
];

const SECTIONS = {
  "0": "レベル0 ─ まねっこ（導入）",
  "1": "レベル1 ─ つなぐ",
  "2": "レベル2 ─ かくれみち",
  "3": "レベル3 ─ せっけい",
  "4": "レベル4 ─ かんがえる",
  "5": "レベル5 ─ チャレンジ",
};

const grid = document.getElementById("grid");
let current = null;

for (const [lv, no, title, task, clear, note, star] of CARDS) {
  if (lv !== current) {
    current = lv;
    const h = document.createElement("div");
    h.className = "sec";
    h.textContent = SECTIONS[lv];
    grid.appendChild(h);
  }
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <span class="badge lv${lv}">LEVEL ${lv}</span>
      <span class="no">${no}</span>
      ${star ? '<span class="star">★おすすめ</span>' : ""}
    </div>
    <h2 class="title"></h2>
    <p class="task"></p>
    <p class="clear"></p>
    <p class="note"></p>`;
  card.querySelector(".title").textContent = title;
  card.querySelector(".task").textContent = task;
  card.querySelector(".clear").textContent = clear;
  card.querySelector(".note").textContent = note;
  grid.appendChild(card);
}
</script>
</body>
</html>
