; PlatformIO configuration for Matter CO2 Sensor
; Target: ESP32-C3 with Arduino framework 3.x (built-in Matter support)

[env:esp32-c3-devkitm-1]
platform = espressif32@>=6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; Arduino ESP32 3.x includes Matter (chip-device-layer) built-in.
; The two sensor libraries cover SCD40 (I2C) and MH-Z19B (UART).
lib_deps =
    sensirion/SensirionI2cScd4x@^0.4.0
    WifWaf/MH-Z19@^1.5.3

build_flags =
    ; Enable Matter / OpenThread stack
    -DCONFIG_ENABLE_CHIP_SHELL=0
    -DCONFIG_ESP_MATTER_ENABLE_DATA_MODEL=1
    ; Increase main task stack to accommodate Matter + sensor work
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Reserve enough heap for Matter commissioning (~100 KB minimum)
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    ; USB-CDC serial on ESP32-C3 (needed for Serial output over USB)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Optional: enable verbose Matter logging during development
; build_flags =
;     ${env.build_flags}
;     -DCHIP_ERROR_LOGGING=1
;     -DCHIP_PROGRESS_LOGGING=1
